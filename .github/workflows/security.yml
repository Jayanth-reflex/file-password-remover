name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because "no known vulnerabilities" is a statement with a shelf life.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  static-analysis:
    timeout-minutes: 20
    name: bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install bandit[toml]
      - name: bandit over src/
        run: bandit -q -c pyproject.toml -r src
      - name: machine-readable report
        if: always()
        run: bandit -q -c pyproject.toml -r src -f json -o bandit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit
          path: bandit.json

  dependencies:
    timeout-minutes: 20
    name: vulnerable dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,sevenzip]"
      - name: pip-audit
        # --skip-editable skips this project itself, which is installed with -e
        # and has no PyPI release to resolve against. --strict is deliberately
        # not used: it fails on *any* skipped distribution, which would make
        # that expected skip a permanent red build. The strict check that
        # matters runs in the next step, which queries OSV directly for every
        # pinned dependency and exits non-zero on any advisory.
        run: pip-audit --progress-spinner off --skip-editable
      - name: OSV query and licence evidence
        run: python scripts/audit_dependencies.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-evidence
          path: docs/research/evidence/*.json

  secrets:
    timeout-minutes: 20
    name: secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Point at the config explicitly rather than relying on auto-detection.
          # It allows the sample passwords in the fixture generators and nothing
          # else; see .gitleaks.toml.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

  policy:
    timeout-minutes: 20
    name: policy and privacy invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,sevenzip]"
      - name: abuse cases, leak tests, and the no-network guarantee
        run: python -m pytest -q tests/security -v
