name: Mobile

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios:
    name: iOS (Swift engine + app)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The Swift tests decrypt files generated by the Python implementation,
      # so the corpus has to exist before they run.
      - name: Generate the shared test-vector corpus
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[sevenzip]"
          python scripts/gen_vectors.py build/vectors

      - name: Engine tests
        working-directory: ios/FprKit
        run: swift test --parallel

      - name: Check the Xcode project is in sync with its generator
        run: |
          python scripts/gen_xcodeproj.py
          git diff --exit-code ios/FilePasswordRemover.xcodeproj

      - name: Build the app
        run: |
          xcodebuild \
            -project ios/FilePasswordRemover.xcodeproj \
            -scheme FilePasswordRemover \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-dd \
            build

      - uses: actions/upload-artifact@v4
        with:
          name: ios-app-simulator
          path: build/ios-dd/Build/Products/Release-iphonesimulator/FilePasswordRemover.app
          if-no-files-found: error

  android:
    name: Android (Kotlin engine + app)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate the shared test-vector corpus
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[sevenzip]"
          python scripts/gen_vectors.py build/vectors

      - name: Engine tests
        working-directory: android
        run: gradle :fprkit:test

      - name: Build the APK
        working-directory: android
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: android/fprkit/build/reports/tests/

  android-device:
    name: Android (on a real ART runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate the shared test-vector corpus
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[sevenzip]"
          python scripts/gen_vectors.py build/vectors

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The JVM tests prove the algorithms; this proves they still hold on ART,
      # whose crypto providers, XML parser and zip implementation are not the
      # JDK's.
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # Kept on one line: a backslash continuation inside this action's
          # script block is passed through literally, and Gradle then looks for
          # a task named '\'.
          script: |
            adb push build/vectors /data/local/tmp/fpr-vectors
            cd android && gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.fprVectors=/data/local/tmp/fpr-vectors

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-instrumented-reports
          path: android/app/build/reports/androidTests/
