name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs are a dry run of the artifact pipeline: everything is built and
  # smoke-tested, and the publish job is skipped because it requires a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sdist-wheel:
    name: wheel + sdist
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: bash scripts/verify_install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  bundles:
    name: desktop bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: pip install -e ".[build]"
      - name: Build and smoke-test the bundle
        shell: bash
        run: bash scripts/build_desktop.sh
      - name: Archive
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "file-password-remover-${{ runner.os }}-${{ runner.arch }}.zip" file-password-remover
          else
            tar czf "file-password-remover-${{ runner.os }}-${{ runner.arch }}.tar.gz" file-password-remover
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  pypi:
    name: publish to PyPI
    needs: [sdist-wheel]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Trusted Publishing: no API token is stored anywhere. PyPI is configured to
    # trust this repository, this workflow file and this environment, and the
    # job authenticates with a short-lived OIDC credential.
    #
    # Until the PyPI project exists and names this workflow as a trusted
    # publisher, the job is skipped rather than failing the release -- see
    # docs/ops/release.md for the one-time setup.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/file-password-remover
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      # The engine is tested against files the Python implementation generates,
      # so an APK is never published without that having passed.
      - name: Generate the shared test-vector corpus
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[sevenzip]"
          python scripts/gen_vectors.py build/vectors

      - name: Test the engine
        working-directory: android
        run: gradle :fprkit:test

      - name: Build the APK
        working-directory: android
        run: gradle :app:assembleDebug

      - name: Name it after the release
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "dist/file-password-remover-android-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  publish:
    name: checksums and draft release
    needs: [sdist-wheel, bundles, android]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only a tag produces a release. Running this workflow by hand is therefore
    # a dry run: it builds the wheel and all three desktop bundles and
    # smoke-tests each one, without creating anything public. Use it to prove
    # the pipeline works before tagging, rather than discovering a broken
    # bundle job from a half-finished release.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: staging
      - name: Collect artifacts
        run: |
          mkdir -p dist
          find staging -type f \
            \( -name '*.whl' -o -name '*.tar.gz' -o -name '*.zip' -o -name '*.apk' \) \
            -exec cp {} dist/ \;
          ls -la dist
      - name: Checksums
        run: bash scripts/checksums.sh
      - name: Draft a release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*
          body: |
            See CHANGELOG.md for what changed, and
            docs/reports/known-limitations.md for what this release does not do.

            Signing status: the bundles produced by this workflow are
            **unsigned**, and the Android APK is **debug-signed**. Signing and
            notarisation require identities that are not stored in this
            repository; see docs/ops/release.md.

            There is no iOS build here. A distributable iOS app needs a paid
            Apple Developer Program membership, which this project does not
            have; build it from `ios/FilePasswordRemover.xcodeproj` with your
            own Apple ID. See docs/adr/0011-ship-mobile-apps-verified-not-published.md.
