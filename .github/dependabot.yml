version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR for the developer toolchain; these move often and together.
      dev-tooling:
        patterns: ["ruff", "mypy", "pytest*", "bandit", "pip-audit", "pyinstaller", "types-*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
    ignore:
      # gradle/actions v6 moved its caching into a proprietary component, and
      # upgrading to it accepts Gradle's Terms of Use for that component. v5 is
      # the last major under MIT alone. Minor and patch releases of v5 still
      # arrive; a new major is a licensing decision, taken deliberately rather
      # than in a weekly bot PR.
      - dependency-name: "gradle/actions"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "container"]
    commit-message:
      prefix: "chore(docker)"
