# gitleaks configuration.
#
# The default rule set is kept in full. The allowances are for code and docs
# that necessarily contain sample passwords:
#
# * The fixture generators, which exist to *create* password-protected sample
#   files. Those constants protect nothing -- the files they lock are generated
#   by the same module and deleted when the test run ends.
# * The protect tests and the interop checker, which have to supply a password
#   in order to test supplying one. The shared literal is the same in all three
#   language implementations so each can open what the others wrote.
# * Documentation showing what a generated password looks like. Those are real
#   output from real runs, for files that were thrown away.
#
# Nothing under src/ outside the fixture generators is allowlisted, so a real
# credential committed into the library itself still fails the scan.

title = "file-password-remover"

[extend]
useDefault = true

[allowlist]
description = "Sample passwords used to generate test fixtures"
paths = [
  '''src/fpr/testing/fixtures\.py''',
  '''src/fpr/testing/zipcrypto\.py''',
  # Tests that exercise supplying and generating passwords.
  '''tests/integration/test_protect\.py''',
  '''tests/integration/test_cli_protect\.py''',
  '''ios/FprKit/Tests/FprKitTests/ProtectTests\.swift''',
  '''android/fprkit/src/test/kotlin/dev/jayanth/fpr/ProtectTest\.kt''',
  '''scripts/check_interop\.py''',
  # Documentation showing example output, including generated passwords.
  '''README\.md''',
  '''site/agents\.md''',
  '''docs/design/design-system\.md''',
]
regexes = [
  '''correct horse battery staple''',
  '''not the password''',
  '''owner-only-secret''',
  '''SAMPLE_PASSWORD''',
  '''WRONG_PASSWORD''',
  '''OWNER_PASSWORD''',
  # The fixed literal the three implementations share, so each can open the
  # protected files the others wrote. It guards throwaway test artifacts.
  '''interop-fixed-password''',
]
