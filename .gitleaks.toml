# gitleaks configuration.
#
# The default rule set is kept in full. The only allowance is for the fixture
# generators, which exist to *create* password-protected sample files and
# therefore contain sample passwords by design. Those constants protect
# nothing: the files they lock are generated by the same module and deleted
# when the test run ends.
#
# The allowance is scoped to those two paths and to the exact literals, so a
# real credential appearing anywhere else -- including elsewhere in
# src/fpr/testing/ -- still fails the scan.

title = "file-password-remover"

[extend]
useDefault = true

[allowlist]
description = "Sample passwords used to generate test fixtures"
paths = [
  '''src/fpr/testing/fixtures\.py''',
  '''src/fpr/testing/zipcrypto\.py''',
]
regexes = [
  '''correct horse battery staple''',
  '''not the password''',
  '''owner-only-secret''',
  '''SAMPLE_PASSWORD''',
  '''WRONG_PASSWORD''',
  '''OWNER_PASSWORD''',
]
