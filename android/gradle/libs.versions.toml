[versions]
agp = "8.7.3"
kotlin = "2.0.21"
commonsCompress = "1.27.1"
junit = "4.13.2"
composeBom = "2024.10.01"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
coreKtx = "1.15.0"

[libraries]
# 7-Zip, including AES-256 encrypted archives, and LZMA/LZMA2 decoding.
# Apache-2.0, so it does not change the licensing story.
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }
pdfbox = { group = "org.apache.pdfbox", name = "pdfbox", version = "3.0.3" }
xz = { group = "org.tukaani", name = "xz", version = "1.10" }
pdfbox-android = { group = "com.tom-roush", name = "pdfbox-android", version = "2.0.27.0" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
gson = { group = "com.google.code.gson", name = "gson", version = "2.11.0" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-test-runner = { group = "androidx.test", name = "runner", version = "1.6.2" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version = "1.2.1" }
androidx-test-espresso-intents = { group = "androidx.test.espresso", name = "espresso-intents", version = "3.6.1" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
